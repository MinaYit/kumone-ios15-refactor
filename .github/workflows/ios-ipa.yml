name: Build Kumone iOS 15 IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "Sources/**"
      - "ios/**"
      - "Package.swift"
      - "Package.resolved"
      - ".github/workflows/ios-ipa.yml"

permissions:
  contents: read

jobs:
  build-ios-15-ipa:
    name: Build unsigned iOS 15 IPA
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Show build environment
        run: |
          xcodebuild -version
          xcodebuild -workspace ios/KumoneIOS.xcworkspace -list

      - name: Build for generic iOS device
        run: |
          xcodebuild \
            -workspace ios/KumoneIOS.xcworkspace \
            -scheme KumoneIOS \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/kumone-ios-dd" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            MARKETING_VERSION="0.3.12" \
            CURRENT_PROJECT_VERSION="${GITHUB_RUN_NUMBER}" \
            build

      - name: Package IPA
        run: |
          APP="$RUNNER_TEMP/kumone-ios-dd/Build/Products/Release-iphoneos/KumoneIOS.app"
          test -d "$APP"
          mkdir -p "$RUNNER_TEMP/ipa/Payload" dist
          cp -R "$APP" "$RUNNER_TEMP/ipa/Payload/"
          (
            cd "$RUNNER_TEMP/ipa"
            /usr/bin/zip -qry "$GITHUB_WORKSPACE/dist/Kumone-iOS-15-${GITHUB_RUN_NUMBER}.ipa" Payload
          )
          shasum -a 256 dist/*.ipa | tee dist/SHA256SUMS.txt
          ls -lh dist

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kumone-iOS-15-unsigned-ipa
          path: dist/
          if-no-files-found: error
          retention-days: 14
